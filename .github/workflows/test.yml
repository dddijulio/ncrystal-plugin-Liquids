name: test

on:
  push:
  pull_request:
  schedule:
    - cron: '15 8 * * 1'   # 8:15 every Monday

jobs:
  build_and_test_plugin:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: src

    - name: Install dependencies
      run: pip install 'ncrystal>=4.4.4'

    - name: Install plugin
      run: pip install ./src

    - name: Run plugin self-tests
      run: ncrystal-pluginmanager --test Liquids

    - name: Use explicit plugin file
      run: nctool -d 'plugins::Liquids/H2O_liquid.ncmat'
